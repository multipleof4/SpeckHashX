version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/npm"
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: bun
    directories:
      - "/site"
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      bun-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
